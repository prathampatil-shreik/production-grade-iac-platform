# .github/workflows/ci.yml
#
# Stage 4 — CI pipeline (pull request gate)
#
# Triggered on every pull request targeting main.
# Uses static AWS credentials stored as GitHub secrets.
#
# Jobs:
#   quality    — terraform fmt, validate, tflint
#   security   — checkov, OPA unit tests, conftest plan fixtures
#   plan-dev   — terraform plan for envs/dev (read-only, no apply)
#   plan-prod  — terraform plan for envs/prod (read-only, no apply)
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID     — IAM user access key
#   AWS_SECRET_ACCESS_KEY — IAM user secret key
#   AWS_REGION            — e.g. us-east-1
#   TF_VAR_DB_PASSWORD    — database password (used for plan only, never applied)
#   DEV_BUCKET_SUFFIX     — unique suffix for the dev S3 bucket name
#   PROD_BUCKET_SUFFIX    — unique suffix for the prod S3 bucket name

name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"
      - "policy/**"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.0"

jobs:
  # ── Job 1: Terraform quality checks ────────────────────────────────────────
  quality:
    name: Terraform Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: TFLint init
        run: tflint --init

      - name: Validate + TFLint — modules/vpc
        run: |
          cd modules/vpc
          terraform init -backend=false -input=false
          terraform validate
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Validate + TFLint — modules/compute
        run: |
          cd modules/compute
          terraform init -backend=false -input=false
          terraform validate
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Validate + TFLint — modules/database
        run: |
          cd modules/database
          terraform init -backend=false -input=false
          terraform validate
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Validate + TFLint — modules/storage
        run: |
          cd modules/storage
          terraform init -backend=false -input=false
          terraform validate
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Validate — envs/dev
        run: |
          cd envs/dev
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate — envs/prod
        run: |
          cd envs/prod
          terraform init -backend=false -input=false
          terraform validate

  # ── Job 2: Security and policy checks ──────────────────────────────────────
  security:
    name: Security & Policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v0.68.0

      - name: OPA unit tests
        run: opa test policy/terraform --verbose

      - name: Setup Conftest
        run: |
          curl -sLo conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Conftest — pass_plan fixture (expect 0 violations)
        run: |
          conftest test policy/testdata/pass_plan.json \
            --policy policy/terraform --all-namespaces

      - name: Conftest — fail_plan fixture (expect violations)
        run: |
          # This must exit non-zero (violations detected). We invert the exit
          # code so the step passes when violations ARE found as expected.
          conftest test policy/testdata/fail_plan.json \
            --policy policy/terraform --all-namespaces && exit 1 || exit 0

  # ── Job 3: Terraform plan — dev ─────────────────────────────────────────────
  plan-dev:
    name: Plan dev
    runs-on: ubuntu-latest
    needs: [quality, security]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — dev
        working-directory: envs/dev
        run: terraform init -input=false

      - name: terraform plan — dev
        id: plan_dev
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.DEV_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
        run: |
          terraform plan -input=false -no-color -out=dev.tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — dev\n\`\`\`\n${truncated}\n\`\`\``
            });

  # ── Job 4: Terraform plan — prod ────────────────────────────────────────────
  plan-prod:
    name: Plan prod
    runs-on: ubuntu-latest
    needs: [quality, security]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — prod
        working-directory: envs/prod
        run: terraform init -input=false

      - name: terraform plan — prod
        id: plan_prod
        working-directory: envs/prod
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.PROD_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
        run: |
          terraform plan -input=false -no-color -out=prod.tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/prod/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — prod\n\`\`\`\n${truncated}\n\`\`\``
            });
