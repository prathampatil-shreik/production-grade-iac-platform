# .github/workflows/drift.yml
#
# Stage 5 — Drift detection (scheduled + manual)
#
# Runs daily at 06:00 UTC. Executes terraform plan -detailed-exitcode for
# both environments. If exit code 2 is returned (changes present), drift has
# occurred and a GitHub issue is opened automatically with the plan diff.
#
# Exit codes from terraform plan -detailed-exitcode:
#   0 — no changes (no drift)
#   1 — error
#   2 — changes present (drift detected)
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID     — IAM user access key
#   AWS_SECRET_ACCESS_KEY — IAM user secret key
#   AWS_REGION
#   TF_VAR_DB_PASSWORD
#   DEV_BUCKET_SUFFIX
#   PROD_BUCKET_SUFFIX

name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:        # allow manual trigger for evidence/testing

permissions:
  contents: read
  issues: write

env:
  TF_VERSION: "1.10.0"

jobs:
  # ── Drift check — dev ────────────────────────────────────────────────────────
  drift-dev:
    name: Drift check — dev
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
      plan_summary: ${{ steps.plan.outputs.plan_summary }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — dev
        working-directory: envs/dev
        run: terraform init -input=false

      - name: terraform plan — dev (drift check)
        id: plan
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.DEV_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
          TF_VAR_db_instance_class: "db.t3.micro"
          TF_VAR_db_allocated_storage: "20"
          TF_VAR_db_max_allocated_storage: "50"
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Capture last 100 lines of plan as summary for issue body
          SUMMARY=$(tail -100 plan_output.txt)
          echo "plan_summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED in dev environment"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift in dev environment"
          else
            echo "drift_detected=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-dev-plan
          path: envs/dev/plan_output.txt
          retention-days: 7

  # ── Drift check — prod ───────────────────────────────────────────────────────
  drift-prod:
    name: Drift check — prod
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
      plan_summary: ${{ steps.plan.outputs.plan_summary }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — prod
        working-directory: envs/prod
        run: terraform init -input=false

      - name: terraform plan — prod (drift check)
        id: plan
        working-directory: envs/prod
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.PROD_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
          TF_VAR_db_instance_class: "db.t3.micro"
          TF_VAR_db_allocated_storage: "20"
          TF_VAR_db_max_allocated_storage: "50"
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          SUMMARY=$(tail -100 plan_output.txt)
          echo "plan_summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED in prod environment"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift in prod environment"
          else
            echo "drift_detected=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-prod-plan
          path: envs/prod/plan_output.txt
          retention-days: 7

  # ── Open issue on drift ──────────────────────────────────────────────────────
  report-drift:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [drift-dev, drift-prod]
    if: |
      needs.drift-dev.outputs.drift_detected == 'true' ||
      needs.drift-prod.outputs.drift_detected == 'true'

    steps:
      - name: Open or update drift issue
        uses: actions/github-script@v7
        with:
          script: |
            const devDrift  = '${{ needs.drift-dev.outputs.drift_detected }}' === 'true';
            const prodDrift = '${{ needs.drift-prod.outputs.drift_detected }}' === 'true';
            const envs = [devDrift && 'dev', prodDrift && 'prod'].filter(Boolean).join(', ');

            const devSummary  = `${{ needs.drift-dev.outputs.plan_summary }}`;
            const prodSummary = `${{ needs.drift-prod.outputs.plan_summary }}`;

            const planSection = [
              devDrift  ? `### dev plan diff\n\`\`\`\n${devSummary}\n\`\`\`` : '',
              prodDrift ? `### prod plan diff\n\`\`\`\n${prodSummary}\n\`\`\`` : '',
            ].filter(Boolean).join('\n\n');

            const title = `[Drift] Infrastructure drift detected in: ${envs}`;
            const body = [
              '## Infrastructure Drift Detected',
              '',
              `Terraform plan found differences between state and real infrastructure in: **${envs}**`,
              '',
              planSection,
              '',
              '### How to fix',
              '1. Review the plan diff above to understand what changed out-of-band.',
              '2. If the change is **unintentional**: revert it in AWS Console, then re-run this workflow to confirm no drift.',
              '3. If the change is **intentional**: update the Terraform code to match, open a PR, and merge to reconcile via CD.',
              '4. Once fixed, close this issue.',
              '',
              `Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });

            const existing = issues.find(i => i.title.startsWith('[Drift]'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `New drift detected on ${new Date().toISOString()}.\n\n${body}`,
              });
              console.log(`Updated existing drift issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift', 'infrastructure'],
              });
              console.log(`Created drift issue #${issue.number}`);
            }
