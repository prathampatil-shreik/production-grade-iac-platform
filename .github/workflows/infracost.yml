# .github/workflows/infracost.yml
#
# Stage 4 — Infracost cost estimation on pull requests
#
# Triggered on every pull request targeting main that modifies Terraform config.
# Generates a monthly cost breakdown for envs/dev and envs/prod and posts
# a single combined comment on the PR (updated on re-runs, never duplicated).
#
# Required GitHub secrets:
#   INFRACOST_API_KEY     — from https://www.infracost.io/docs/#2-get-api-key
#   AWS_ACCESS_KEY_ID     — IAM user access key (read-only is sufficient)
#   AWS_SECRET_ACCESS_KEY — IAM user secret key
#   AWS_REGION            — e.g. us-east-1
#   TF_VAR_DB_PASSWORD    — database password (used for plan parsing only)
#   DEV_BUCKET_SUFFIX     — unique suffix for the dev S3 bucket name
#   PROD_BUCKET_SUFFIX    — unique suffix for the prod S3 bucket name

name: Infracost

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"
      - ".github/workflows/infracost.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.0"

jobs:
  infracost:
    name: Cost estimation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # required — Infracost reads plan JSON directly

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # ── Generate plan JSON for envs/dev ──────────────────────────────────────

      - name: terraform init — dev
        working-directory: envs/dev
        run: terraform init -input=false

      - name: terraform plan — dev
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.DEV_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
          TF_VAR_db_instance_class: "db.t3.micro"
          TF_VAR_db_allocated_storage: "20"
          TF_VAR_db_max_allocated_storage: "50"
        run: terraform plan -input=false -out=dev.tfplan

      - name: Convert dev plan to JSON
        working-directory: envs/dev
        run: terraform show -json dev.tfplan > dev-plan.json

      # ── Generate plan JSON for envs/prod ─────────────────────────────────────

      - name: terraform init — prod
        working-directory: envs/prod
        run: terraform init -input=false

      - name: terraform plan — prod
        working-directory: envs/prod
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.PROD_BUCKET_SUFFIX }}
          TF_VAR_db_backup_retention_period: "0"
          TF_VAR_db_multi_az: "false"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_skip_final_snapshot: "true"
          TF_VAR_db_instance_class: "db.t3.micro"
          TF_VAR_db_allocated_storage: "20"
          TF_VAR_db_max_allocated_storage: "50"
        run: terraform plan -input=false -out=prod.tfplan

      - name: Convert prod plan to JSON
        working-directory: envs/prod
        run: terraform show -json prod.tfplan > prod-plan.json

      # ── Infracost breakdown ───────────────────────────────────────────────────

      - name: Infracost breakdown — dev
        run: |
          infracost breakdown \
            --path envs/dev/dev-plan.json \
            --format json \
            --out-file /tmp/infracost-dev.json

      - name: Infracost breakdown — prod
        run: |
          infracost breakdown \
            --path envs/prod/prod-plan.json \
            --format json \
            --out-file /tmp/infracost-prod.json

      # ── Post combined comment on PR ───────────────────────────────────────────

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost-dev.json \
            --path /tmp/infracost-prod.json \
            --repo ${{ github.repository }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --behavior update
