# .github/workflows/cd.yml
#
# Stage 4 — CD pipeline (deploy on merge to main)
#
# Triggered on push to main (i.e. after a PR is merged).
# Uses static AWS credentials stored as GitHub secrets.
#
# Jobs:
#   apply-dev   — terraform apply for envs/dev (automatic after merge)
#   apply-prod  — terraform apply for envs/prod (requires manual approval
#                 via GitHub Environment protection rules)
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID     — IAM user access key
#   AWS_SECRET_ACCESS_KEY — IAM user secret key
#   AWS_REGION            — e.g. us-east-1
#   TF_VAR_DB_PASSWORD    — database master password
#   DEV_BUCKET_SUFFIX     — unique suffix for the dev S3 bucket name
#   PROD_BUCKET_SUFFIX    — unique suffix for the prod S3 bucket name
#
# Required GitHub Environments:
#   dev   — no protection rules (auto-deploy)
#   prod  — required reviewers protection rule (manual approval gate)

name: CD

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"

jobs:
  # ── Job 1: Apply dev ─────────────────────────────────────────────────────────
  apply-dev:
    name: Apply dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — dev
        working-directory: envs/dev
        run: terraform init -input=false

      - name: terraform plan — dev
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.DEV_BUCKET_SUFFIX }}
        run: terraform plan -input=false -no-color -out=dev.tfplan

      - name: terraform apply — dev
        working-directory: envs/dev
        run: terraform apply -input=false -no-color dev.tfplan

  # ── Job 2: Apply prod ────────────────────────────────────────────────────────
  apply-prod:
    name: Apply prod
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — prod
        working-directory: envs/prod
        run: terraform init -input=false

      - name: terraform plan — prod
        working-directory: envs/prod
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.PROD_BUCKET_SUFFIX }}
        run: terraform plan -input=false -no-color -out=prod.tfplan

      - name: terraform apply — prod
        working-directory: envs/prod
        run: terraform apply -input=false -no-color prod.tfplan
